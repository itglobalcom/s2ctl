[tool.poetry]
name = "s2ctl"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]


[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.14"
click = "^8.3"
tabulate = "^0.10"
keyring = "^25.7"
config-path = "^1.0.5"
"keyrings.cryptfile" = "^1.3.9"
# asyncio.timeout появился в Python 3.11, минимальная поддерживаемая версия — 3.10
async-timeout = "^5.0"
PyYAML = "^6.0"
# certifi — rolling-набор корневых сертификатов, верхняя граница по мажору его бы заморозила
certifi = ">=2026.7.22"

[tool.poetry.group.dev.dependencies]
tox = "^4.61"
flake8 = "^7.3"
wemake-python-styleguide = "^1.8"
pytest = "^8.4"
pytest-xdist = "^3.8"
pytest-aiohttp = "^1.1"
pytest-asyncio = "^1.4"
pytest-cov = "^7.1"
autopep8 = "^2.3"
# верхняя граница Python — от самого pyinstaller (<3.16), без маркера lock не решается
pyinstaller = {version = "^6.22", python = ">=3.10,<3.16"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
s2ctl = 's2ctl.entrypoint:run_cli'

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.isort]
multi_line_output = 3
line_length = 120
include_trailing_comma = true
