[tool.poetry]
name = "s2ctl"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]


[tool.poetry.dependencies]
python = "^3.11"
aiohttp = "^3.14"
click = "^8.3"
tabulate = "^0.10"
keyring = "^25.7"
config-path = "^1.0.5"
"keyrings.cryptfile" = "^1.3.9"
PyYAML = "^6.0"
# certifi — rolling-набор корневых сертификатов, верхняя граница по мажору его бы заморозила
certifi = ">=2026.7.22"

[tool.poetry.group.dev.dependencies]
tox = "^4.61"
flake8 = "^7.3"
wemake-python-styleguide = "^1.8"
pytest = "^8.4"
# pytest-xdist: не ради `-n`, а ради `-f/--looponfail` — его даёт только он,
# и на нём стоит цель `make test-watch`
pytest-xdist = "^3.8"
pytest-aiohttp = "^1.1"
pytest-asyncio = "^1.4"
pytest-cov = "^7.1"
pyright = "^1.1"
# верхняя граница Python — от самого pyinstaller (<3.16), без маркера lock не решается
pyinstaller = {version = "^6.22", python = ">=3.11,<3.16"}
# flake8-isort: порядок импортов проверяет гейт `make lint`; в wemake-python-styleguide 1.x
# плагин больше не входит, конфигурация самого isort — секция `[tool.isort]` ниже
flake8-isort = "^6.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
s2ctl = 's2ctl.entrypoint:run_cli'

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
# Конфигурация гейта `poetry run pyright ./src`: он же в Makefile и в пайплайне.
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.isort]
# Читается плагином flake8-isort в гейте `make lint`; длина строки — та же, что в `.flake8`.
line_length = 120
multi_line_output = 3
include_trailing_comma = true
